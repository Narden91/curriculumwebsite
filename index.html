    <!-- Theme Detection Script - runs immediately on html element -->
    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    
    <!-- SPA Redirect Handler for GitHub Pages -->
    <script>
      (function() {
        // Handle query parameter redirect from 404.html
        const params = new URLSearchParams(location.search);
        const path = params.get('p');
        if (path) {
          params.delete('p');
          const newSearch = params.toString();
          const newUrl = location.pathname.replace(/\/$/, '') + path + (newSearch ? '?' + newSearch : '') + location.hash;
          history.replaceState(null, null, newUrl);
        }
      })();
    </script>
