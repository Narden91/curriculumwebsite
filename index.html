    <!-- Theme Detection Script - runs immediately on html element -->
    <script>
      (function() {
        // Dark by default; light only when the visitor picked it with the toggle.
        var theme = null;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
      })();
    </script>
    
    <!-- SPA Redirect Handler for GitHub Pages -->
    <script>
      (function() {
        // Handle query parameter redirect from 404.html
        const params = new URLSearchParams(location.search);
        const path = params.get('p');
        if (path) {
          params.delete('p');
          const newSearch = params.toString();
          const newUrl = location.pathname.replace(/\/$/, '') + path + (newSearch ? '?' + newSearch : '') + location.hash;
          history.replaceState(null, null, newUrl);
        }
      })();
    </script>
